[project]
name = "ncm-spec"
version = "0.1.0"
description = "Concept-level speculative decoding for local LLMs on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.32",
    "numpy",
    "huggingface_hub",
    "tqdm",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "torch>=2.8",
    "transformers>=4.51",
    "datasets",
    "safetensors",
    "pytest",
    "ruff",
    "omegaconf>=2.3.1",
    "hydra-core>=1.3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncm_spec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
